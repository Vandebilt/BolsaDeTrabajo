    <style>
        /* Google Font Link */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');

        body {
            font-family: "Poppins", sans-serif;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
        }

        .tituloFacpya {
            width: 100%;
            text-align: center;
            font-size: 22px;
            letter-spacing: 8px; /* separa las letras */
            font-weight: 500;
            color: #222;
            margin: 0 !important;
        }

        /*-- Para que tituloFacpya esté arriba --*/
        .pagina {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 40px;
            max-width: 1200px;
            flex-wrap: wrap;
        }

        .imagen {
            width: 350px;
            max-width: 100%;
            height: auto;
        }

        .separador {
            width: 3px;
            height: 250px;
            background-color: #333;
            box-shadow: 3px 8px 5px rgba(0,0,0,0.15); /*Agrega sombra */
            border-radius: 3px;
        }

        article {
            text-align: left;
            max-width: 500px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        /* --- Diseño responsivo --- */
        @media (max-width: 768px) {
            body {
                height: auto;
                padding: 40px 20px;
            }

            .contenedor {
                flex-direction: column;
                text-align: center;
            }

            .separador {
                width: 80%;
                height: 3px;
                margin: 20px 0;
            }

            article {
                text-align: center;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>

</head>
